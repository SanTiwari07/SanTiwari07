<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Sudarshan: Android banking malware sandbox and threat intelligence platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b1a"/>
      <stop offset="0.6" stop-color="#0a1733"/>
      <stop offset="1" stop-color="#0b2350"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0072ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00c6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00c6ff" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e3a8a" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="440" rx="20"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace; }
    .stage rect { fill: #0b1730; stroke: #1e40af; stroke-width: 1.5; animation: lit 6s infinite; }
    .s1 rect { animation-delay: 0s; }
    .s2 rect { animation-delay: 1s; }
    .s3 rect { animation-delay: 2s; }
    .s4 rect { animation-delay: 3s; }
    .s5 rect { animation-delay: 4s; }
    .s6 rect { animation-delay: 5s; }
    @keyframes lit {
      0%, 22%, 100% { stroke: #1e40af; fill: #0b1730; }
      6%, 14% { stroke: #00c6ff; fill: #0c2a52; }
    }
    .blip { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-delay: 0.8s; }
    .b3 { animation-delay: 1.6s; }
    @keyframes ping {
      0% { opacity: 1; transform: scale(1); }
      70% { opacity: 0.15; transform: scale(2.4); }
      100% { opacity: 0; transform: scale(2.4); }
    }
    .live { animation: blink 1.6s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.25; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#grid)"/>
    <circle cx="985" cy="170" r="230" fill="url(#glow)"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="20" fill="none" stroke="#1d4ed8" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Event chip -->
  <rect x="48" y="40" width="500" height="30" rx="15" fill="#00c6ff" fill-opacity="0.1" stroke="#00c6ff" stroke-opacity="0.35"/>
  <circle class="live" cx="66" cy="55" r="5" fill="#22c55e"/>
  <text x="80" y="60" font-size="12.5" font-weight="600" fill="#7dd3fc" letter-spacing="1.6">FLAGSHIP · CYBERSHIELD HACKATHON 2026 · IIT HYDERABAD</text>

  <!-- Title block -->
  <text x="44" y="150" font-size="78" font-weight="800" letter-spacing="5" fill="url(#title)">SUDARSHAN</text>
  <text x="48" y="194" font-size="22" font-weight="600" fill="#e2e8f0">Android Banking Malware Sandbox &amp; Threat Intelligence</text>
  <text x="48" y="238" font-size="16" font-style="italic" fill="#94a3b8">Your bank's app has a twin. It looks the same, asks for the same PIN,</text>
  <text x="48" y="262" font-size="16" font-style="italic" fill="#94a3b8">and empties the account in 90 seconds. Sudarshan catches it first.</text>

  <!-- Radar -->
  <g transform="translate(985 170)">
    <circle r="120" fill="#050b1a" fill-opacity="0.6" stroke="#1e40af" stroke-width="1.5"/>
    <circle r="80" fill="none" stroke="#1e40af" stroke-opacity="0.7"/>
    <circle r="40" fill="none" stroke="#1e40af" stroke-opacity="0.7"/>
    <path d="M-120 0H120M0 -120V120" stroke="#1e40af" stroke-opacity="0.5"/>
    <g>
      <path d="M0 0 L120 0 A120 120 0 0 0 84.85 -84.85 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="120" y2="0" stroke="#00c6ff" stroke-width="2"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="52" cy="-58" r="5" fill="#ef4444"/>
    <circle class="blip" cx="52" cy="-58" r="5" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle cx="-70" cy="34" r="4" fill="#f59e0b"/>
    <circle class="blip b2" cx="-70" cy="34" r="4" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="28" cy="72" r="4" fill="#ef4444"/>
    <circle class="blip b3" cx="28" cy="72" r="4" fill="none" stroke="#ef4444" stroke-width="2"/>
    <circle r="4" fill="#00c6ff"/>
  </g>
  <text class="mono" x="1048" y="104" font-size="11" fill="#fca5a5">HYDRA · C2</text>
  <text class="mono" x="985" y="318" font-size="11" fill="#64748b" text-anchor="middle" letter-spacing="2">FRIDA · MITRE ATT&amp;CK · IOC</text>

  <!-- Pipeline -->
  <text x="48" y="346" font-size="11.5" font-weight="700" fill="#64748b" letter-spacing="3">AUTONOMOUS PIPELINE</text>
  <line x1="48" y1="384" x2="1152" y2="384" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 6"/>

  <g class="stage s1"><rect x="48" y="360" width="160" height="48" rx="10"/>
    <text class="mono" x="64" y="379" font-size="11" fill="#00c6ff">01</text>
    <text x="64" y="398" font-size="15" font-weight="700" fill="#f1f5f9">Decompile</text></g>
  <g class="stage s2"><rect x="236.8" y="360" width="160" height="48" rx="10"/>
    <text class="mono" x="252.8" y="379" font-size="11" fill="#00c6ff">02</text>
    <text x="252.8" y="398" font-size="15" font-weight="700" fill="#f1f5f9">Detonate</text></g>
  <g class="stage s3"><rect x="425.6" y="360" width="160" height="48" rx="10"/>
    <text class="mono" x="441.6" y="379" font-size="11" fill="#00c6ff">03</text>
    <text x="441.6" y="398" font-size="15" font-weight="700" fill="#f1f5f9">Intercept C2</text></g>
  <g class="stage s4"><rect x="614.4" y="360" width="160" height="48" rx="10"/>
    <text class="mono" x="630.4" y="379" font-size="11" fill="#00c6ff">04</text>
    <text x="630.4" y="398" font-size="15" font-weight="700" fill="#f1f5f9">Correlate IOCs</text></g>
  <g class="stage s5"><rect x="803.2" y="360" width="160" height="48" rx="10"/>
    <text class="mono" x="819.2" y="379" font-size="11" fill="#00c6ff">05</text>
    <text x="819.2" y="398" font-size="15" font-weight="700" fill="#f1f5f9">Score (BFCI)</text></g>
  <g class="stage s6"><rect x="992" y="360" width="160" height="48" rx="10"/>
    <text class="mono" x="1008" y="379" font-size="11" fill="#00c6ff">06</text>
    <text x="1008" y="398" font-size="15" font-weight="700" fill="#f1f5f9">Explain (RAG)</text></g>
</svg>
